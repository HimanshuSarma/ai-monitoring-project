apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-llm-engine
  namespace: default
  labels:
    app: qwen-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-llm
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "11434"
        prometheus.io/path: "/metrics"
      labels:
        app: qwen-llm
    spec:
      containers:
      - name: qwen-inference
        image: ollama/ollama:latest
        env:
        - name: OLLAMA_MODELS
          value: "/root/.ollama/models"
        command: ["/bin/sh", "-c"]
        args:
        - |
          ollama serve &
          sleep 5
          ollama run qwen2.5:1.5b ""
          wait
        ports:
        - containerPort: 11434
          name: http
        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
          requests:
            memory: "2Gi"
            cpu: "1"
        readinessProbe:
          httpGet:
            path: /
            port: 11434
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-llm-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 11434
    targetPort: 11434
    name: http
  selector:
    app: qwen-llm
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ai-agent-keda-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qwen-llm-engine
  minReplicaCount: 0            # True scale to zero
  maxReplicaCount: 2
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
      metricName: http_requests_per_second
      # Query traffic hitting the ALWAYS-RUNNING ai-agent microservice
      query: sum(increase(k8s_error_events_total[2m])) or vector(0)
      threshold: '10'