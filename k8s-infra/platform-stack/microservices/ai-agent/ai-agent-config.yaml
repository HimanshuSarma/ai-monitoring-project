apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-llm-engine
  namespace: default
  labels:
    app: qwen-llm
spec:
  replicas: 1 # KEDA will scale this dynamically (0 <-> N)
  selector:
    matchLabels:
      app: qwen-llm
  template:
    metadata:
      labels:
        app: qwen-llm
    spec:
      containers:
      - name: qwen-inference
        image: ollama/ollama:latest
        env:
        # Load the 1.5B Instruct model directly on startup
        - name: OLLAMA_MODELS
          value: "/root/.ollama/models"
        # Command to pull and serve the lightweight Qwen2.5 1.5B model
        command: ["/bin/sh", "-c"]
        args:
        - |
          ollama serve &
          sleep 5
          ollama run qwen2.5:1.5b ""
          wait
        ports:
        - containerPort: 11434
          name: http
        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
          requests:
            memory: "2Gi"
            cpu: "1"
        readinessProbe:
          httpGet:
            path: /
            port: 11434
          initialDelaySeconds: 15 # Fast cold start for quantized 1.5B on CPU
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-llm-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 11434
    targetPort: 11434
    name: http
  selector:
    app: qwen-llm
---
