---
  apiVersion: argoproj.io/v1alpha1
  kind: Rollout
  metadata:
    name: error-dispatcher-rollout
  spec:
    replicas: 1
    revisionHistoryLimit: 1
    selector:
      matchLabels:
        app: error-dispatcher
    template:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8000"
          prometheus.io/path: "/metrics"
        labels:
          app: error-dispatcher
      spec:
        containers:
        - name: error-dispatcher
          image: himanshusarma123/ai-monitoring-service-error_dispatcher:e3cda55
          ports:
          - containerPort: 8000
    strategy:
      blueGreen: 
        activeService: error-dispatcher-prod-svc
        previewService: error-dispatcher-staging-svc
        autoPromotionEnabled: false
        scaleDownDelaySeconds: 30
        previewReplicaCount: 1
---
# apiVersion: monitoring.coreos.com/v1
# kind: ServiceMonitor
# metadata:
#   name: error-dispatcher-service-monitor
#   namespace: default          # Keep it in the same namespace as your app
#   labels:
#     release: monitoring-stack
# spec:
#   selector:
#     matchLabels:
#       app: auth-metrics-group
#       role: production
#   endpoints:
#   - port: http                
#     path: /metrics            
#     interval: 10s             
# ---
apiVersion: v1
kind: Service
metadata:
  name: error-dispatcher-prod-svc
  namespace: default
  labels:
    app: error-dispatcher-metrics-group
    role: production
spec:
  type: ClusterIP
  selector:
    app: error-dispatcher
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: error-dispatcher-staging-svc
  namespace: default
  labels:
    app: error-dispatcher-metrics-group
    role: staging
spec:
  type: ClusterIP
  selector:
    app: error-dispatcher
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000