---
  apiVersion: argoproj.io/v1alpha1
  kind: Rollout
  metadata:
    name: k8s-event-watcher-rollout
  spec:
    replicas: 1
    revisionHistoryLimit: 1
    selector:
      matchLabels:
        app: k8s-event-watcher
    template:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8000"
          prometheus.io/path: "/metrics"
        labels:
          app: k8s-event-watcher
      spec:
        serviceAccountName: k8s-event-watcher-sa
        containers:
        - name: k8s-event-watcher
          image: index.docker.io/himanshusarma123/ai-monitoring-service-k8s_event_watcher:v10
          ports:
          - containerPort: 8000
    strategy:
      blueGreen: 
        activeService: k8s-event-watcher-prod-svc
        previewService: k8s-event-watcher-staging-svc
        autoPromotionEnabled: false
        scaleDownDelaySeconds: 30
        previewReplicaCount: 1
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: k8s-event-watcher-servicemonitor
  namespace: default
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: k8s-event-watcher-metrics-group
  endpoints:
  - port: http
    path: /metrics
    interval: 10s
---
