apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-event-watcher-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-event-watcher-clusterrole
rules:
  # Core Event watching permissions
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # Read-only access to core resources for context-enrichment
  - apiGroups: [""]
    resources: ["pods", "namespaces", "services", "nodes", "endpoints"]
    verbs: ["get", "list", "watch"]

  # Optional: Argo Rollouts & Apps visibility (if tracking rollout events)
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-event-watcher-binding
subjects:
  - kind: ServiceAccount
    name: k8s-event-watcher-sa
    namespace: default  # The namespace where your k8s-event-watcher Deployment lives
roleRef:
  kind: ClusterRole
  name: k8s-event-watcher-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-event-watcher-prod-svc
  namespace: default
  labels:
    app: k8s-event-watcher-metrics-group
    role: production
spec:
  type: ClusterIP
  selector:
    app: k8s-event-watcher
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-event-watcher-staging-svc
  namespace: default
  labels:
    app: k8s-event-watcher-metrics-group
    role: staging
spec:
  type: ClusterIP
  selector:
    app: k8s-event-watcher
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000