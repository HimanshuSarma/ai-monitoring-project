name: Build and Push Microservices

on:
  push:
    branches:
      - main
    # Path filtering relative to repository root
    paths:
      - 'microservices/backend/**'
      - 'microservices/error_dispatcher/**'
      - 'microservices/k8s_event_watcher/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Detect which specific microservice folder changed
      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'microservices/backend/**'
            error_dispatcher:
              - 'microservices/error_dispatcher/**'
            k8s_event_watcher:
              - 'microservices/k8s_event_watcher/**'

      # Step 3: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Log in to Docker Hub using GitHub Repository Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Generate a unique version tag based on commit SHA
      - name: Generate Version Tag
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # =======================================================
      # SERVICE 1: backend
      # =======================================================
      - name: Build and Push Backend
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./microservices/backend
          file: ./microservices/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-monitoring-service-backend:${{ env.SHORT_SHA }}

      - name: Update K8s Manifest for Backend
        if: steps.filter.outputs.backend == 'true'
        run: |
          sed -i "s|image: .*/ai-monitoring-service-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ai-monitoring-service-backend:${{ env.SHORT_SHA }}|g" k8s-infra/platform-stack/microservices/backend/backend-config.yaml

      # =======================================================
      # SERVICE 2: error_dispatcher
      # =======================================================
      - name: Build and Push Error Dispatcher
        if: steps.filter.outputs.error_dispatcher == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./microservices/error_dispatcher
          file: ./microservices/error_dispatcher/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-monitoring-service-error_dispatcher:${{ env.SHORT_SHA }}  

      - name: Update K8s Manifest for Error Dispatcher
        if: steps.filter.outputs.error_dispatcher == 'true'
        run: |
          sed -i "s|image: .*/ai-monitoring-service-error_dispatcher:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ai-monitoring-service-error_dispatcher:${{ env.SHORT_SHA }}|g" k8s-infra/platform-stack/microservices/error-dispatcher/error-dispatcher-config.yaml

      # =======================================================
      # SERVICE 3: k8s_event_watcher
      # =======================================================
      - name: Build and Push K8s Event Watcher
        if: steps.filter.outputs.k8s_event_watcher == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./microservices/k8s_event_watcher
          file: ./microservices/k8s_event_watcher/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-monitoring-service-k8s_event_watcher:${{ env.SHORT_SHA }}

      - name: Update K8s Manifest for K8s Event Watcher
        if: steps.filter.outputs.k8s_event_watcher == 'true'
        run: |
          sed -i "s|image: .*/ai-monitoring-service-k8s_event_watcher:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ai-monitoring-service-k8s_event_watcher:${{ env.SHORT_SHA }}|g" k8s-infra/platform-stack/microservices/k8s-event-watcher-microservice/k8s-event-watcher-microservice-config.yaml

      # =======================================================
      # FINAL STEP: Commit and Push Manifest Changes Back to Git
      # =======================================================
      - name: Commit and Push Updated Manifests
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add k8s-infra/platform-stack/microservices/

          if git diff --staged --quiet; then
            echo "No changes in deployment manifests to commit."
          else
            git commit -m "ci: update image tags to ${{ env.SHORT_SHA }} [skip ci]"
            git push origin main
          fi

